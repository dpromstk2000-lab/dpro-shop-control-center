name: DPRO Customer Workspace CO07B Dry Run UI R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-customer-workspace-co07b-dry-run-ui-r1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD^)"
          test "$BASE" = "71c1a4153826bb98ca442585b463edf6a151e562"
          grep -F 'DPRO-CUSTOMER-WORKSPACE-CO06B-OPERATION-UI-R1-20260921' customer-workspace.js
          grep -F 'id="operationBlock"' customer-workspace.html
          ! grep -F 'id="dryRunPanel"' customer-workspace.html

      - name: Apply CO07B
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/co07b_patch.py
          python /tmp/co07b_patch.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check customer-workspace.js
          grep -F 'DPRO-CUSTOMER-WORKSPACE-CO07B-DRY-RUN-UI-R1-20260921' customer-workspace.js
          grep -F 'cc_customer_onboarding_dry_run' customer-workspace.js
          grep -F 'id="dryRunPanel"' customer-workspace.html
          grep -F '全工程DRY RUN' customer-workspace.html
          grep -F '本番データ書込 0' customer-workspace.html
          grep -F 'id="dryRunForm"' customer-workspace.html
          grep -F 'id="dryRunJourney"' customer-workspace.html
          grep -F '.dryrun-hero' customer-workspace.css
          grep -F 'CO07B-DRY-RUN-UI-R1-20260921' customer-workspace.html
          grep -F 'CO-07' customer-workspace.html

          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(printf 'customer-workspace.css\ncustomer-workspace.html\ncustomer-workspace.js')"
          test "$CHANGED" = "$EXPECTED"

          if git diff --name-only | grep -E '^contact-v1|^product-release-package|\.sql$|^worker|^contact-onboarding|^center9-maintenance' >/dev/null; then
            echo "Protected area changed."
            git diff --name-only
            exit 1
          fi

      - name: Remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/dpro-customer-workspace-co07b-dry-run-ui-r1.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add end-to-end dry run UI CO-07B"
          git push

name: DPRO Product Release Control Center R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-product-release-control-center-r1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-product-release-control-center-r1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard audited baseline
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD^)"
          expected="213c50cf2ed2c8069739ce8400677afea579fba8"
          echo "upload commit parent=$parent"
          echo "audited baseline=$expected"
          if [ "$parent" != "$expected" ]; then
            echo "CONTROL CENTER drift detected. Regenerate integration package before applying."
            exit 1
          fi
          changed="$(git diff --name-only HEAD^ HEAD)"
          echo "$changed"
          test "$changed" = ".github/workflows/dpro-product-release-control-center-r1.yml"

      - name: Write Product Release Control Center files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          from pathlib import Path
          import base64
          payloads = {
              "product-release-package.html": "",
              "product-release-package.css": "",
              "product-release-package.js": "",
          }
          for name, encoded in payloads.items():
              Path(name).write_bytes(base64.b64decode(encoded))
          PY2

      - name: Add Product Release entry to product development
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          from pathlib import Path
          p=Path("product-development.html")
          s=p.read_text(encoding="utf-8")
          nav_anchor='        <a class="active" href="product-development.html"><i>新</i>新規製品開発</a>\n        <a href="factory-v2.html"><i>V2</i>FACTORY V2監査</a>'
          nav_repl='        <a class="active" href="product-development.html"><i>新</i>新規製品開発</a>\n        <a href="product-release-package.html"><i>販</i>商品化・掲載</a>\n        <a href="factory-v2.html"><i>V2</i>FACTORY V2監査</a>'
          action_anchor='          <div class="head-actions">\n            <button id="refreshButton" class="btn secondary" type="button">最新情報に更新</button>'
          action_repl='          <div class="head-actions">\n            <a class="btn secondary" href="product-release-package.html">商品化・掲載</a>\n            <button id="refreshButton" class="btn secondary" type="button">最新情報に更新</button>'
          if 'href="product-release-package.html"><i>販</i>商品化・掲載</a>' not in s:
              if s.count(nav_anchor) != 1:
                  raise SystemExit("nav anchor drift")
              s=s.replace(nav_anchor,nav_repl,1)
          if '<a class="btn secondary" href="product-release-package.html">商品化・掲載</a>' not in s:
              if s.count(action_anchor) != 1:
                  raise SystemExit("head action anchor drift")
              s=s.replace(action_anchor,action_repl,1)
          p.write_text(s,encoding="utf-8")
          PY2

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check product-release-package.js
          python - <<'PY2'
          from pathlib import Path
          h=Path("product-release-package.html").read_text(encoding="utf-8")
          j=Path("product-release-package.js").read_text(encoding="utf-8")
          p=Path("product-development.html").read_text(encoding="utf-8")
          checks={
            "page title":"商品化・掲載" in h,
            "JS build":"DPRO-PRODUCT-RELEASE-CC-R1-20260921" in j,
            "master version":"DPRO_PRODUCT_RELEASE_MASTER_V1.1" in j,
            "final lock import":"cc_product_release_register_final_lock" in j,
            "start package":"cc_product_release_register_package" in j,
            "return import":"cc_product_release_import_return" in j,
            "brushup":"b4_live_public_evidence" in j,
            "final release":"4_public_deploy_evidence" in j,
            "entry nav":p.count('href="product-release-package.html"><i>販</i>商品化・掲載</a>')==1,
            "entry action":p.count('href="product-release-package.html">商品化・掲載</a>')>=1,
            "no service role secret":"SUPABASE_SERVICE_ROLE" not in j and "service_role_key" not in j.lower(),
          }
          for k,v in checks.items(): print(("PASS" if v else "FAIL"),k)
          if not all(checks.values()): raise SystemExit(1)
          PY2

      - name: Remove one-shot workflow
        shell: bash
        run: rm -f .github/workflows/dpro-product-release-control-center-r1.yml

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product-release-package.html product-release-package.css product-release-package.js product-development.html .github/workflows/dpro-product-release-control-center-r1.yml
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Add product release control center"
          git push

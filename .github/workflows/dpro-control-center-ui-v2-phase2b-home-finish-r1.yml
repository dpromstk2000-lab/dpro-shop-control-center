name: DPRO Control Center UI V2 Phase 2B Home Finish R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-control-center-ui-v2-phase2b-home-finish-r1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard Phase 2A
        shell: bash
        run: |
          set -euo pipefail
          grep -F '今日のDPRO SHOP' index.html
          grep -F 'DPRO-CC-UI-V2-PHASE2A-R1-20260921' config.js
          grep -F 'dashboard: ["ダッシュボード", "全顧客と運用状況を確認します"]' app.js
          grep -F 'makeSection("その他")' cc-shell-v2.js
          grep -F 'const updateUnread = (count) => {' cc-shell-v2.js

      - name: Apply Phase 2B
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/phase2b_patch.py
          python /tmp/phase2b_patch.py
          printf '%s' '' | base64 -d >> cc-shell-v2.css

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check cc-shell-v2.js
          node --check config.js

          grep -F '<strong id="pageTitle">ホーム</strong><small id="pageSubtitle">今日やることから始めます</small>' index.html
          grep -F 'id="ccv2ContactAlert"' index.html
          grep -F 'data-ccv2-home-contact-count' index.html
          grep -F 'http-equiv="Cache-Control"' index.html
          grep -F 'dashboard: ["ホーム", "今日やることから始めます"]' app.js
          grep -F '今日、対応が必要な仕事はありません。' app.js
          grep -F 'makeSection("管理ツール")' cc-shell-v2.js
          grep -F 'const homeAlert = $("#ccv2ContactAlert");' cc-shell-v2.js
          grep -F 'PHASE 2-B / home finish' cc-shell-v2.css
          grep -F 'DPRO-CC-UI-V2-PHASE2B-R1-20260921' config.js
          grep -F 'config.js?v=DPRO-CC-UI-V2-PHASE2B-R1-20260921' index.html
          grep -F 'app.js?v=DPRO-CC-UI-V2-PHASE2B-R1-20260921' index.html

          test "$(grep -o 'id="ccv2ContactAlert"' index.html | wc -l)" -eq 1
          if git diff --name-only | grep -E '^contact-v1(\.|-)|^dpro-contact-' >/dev/null; then
            echo "Protected DPRO CONTACT file changed."
            exit 1
          fi

      - name: Remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/dpro-control-center-ui-v2-phase2b-home-finish-r1.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Control Center UI V2 home"
          git push

name: DPRO Customer Workspace CO05B Go Live Gate UI R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-customer-workspace-co05b-go-live-gate-ui-r1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD^)"
          test "$BASE" = "0f01970b59053d57a97e6b2c9697a1445dd5c38f"
          grep -F 'DPRO-CUSTOMER-WORKSPACE-CO04C2-ACTIVE-PROBE-UI-R1-20260921' customer-workspace.js
          grep -F 'id="verificationBlock"' customer-workspace.html
          ! grep -F 'id="goLiveGateBlock"' customer-workspace.html

      - name: Apply CO05B
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/co05b_patch.py
          python /tmp/co05b_patch.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check customer-workspace.js
          grep -F 'DPRO-CUSTOMER-WORKSPACE-CO05B-GO-LIVE-GATE-UI-R1-20260921' customer-workspace.js
          grep -F 'cc_customer_onboarding_go_live_gate' customer-workspace.js
          grep -F 'cc_customer_onboarding_activate_go_live' customer-workspace.js
          grep -F 'id="goLiveGateBlock"' customer-workspace.html
          grep -F '本番開始の最終判定' customer-workspace.html
          grep -F '本番開始を確定' customer-workspace.html
          grep -F '.go-live-gate-block' customer-workspace.css
          grep -F 'CO05B-GO-LIVE-GATE-UI-R1-20260921' customer-workspace.html

          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(printf 'customer-workspace.css\ncustomer-workspace.html\ncustomer-workspace.js')"
          test "$CHANGED" = "$EXPECTED"

          if git diff --name-only | grep -E '^contact-v1|^product-release-package|\.sql$|^worker|^contact-onboarding' >/dev/null; then
            echo "Protected area changed."
            git diff --name-only
            exit 1
          fi

      - name: Remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/dpro-customer-workspace-co05b-go-live-gate-ui-r1.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add final go-live gate UI CO-05B"
          git push

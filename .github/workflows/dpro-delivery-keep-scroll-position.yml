name: DPRO Delivery Keep Scroll Position

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch delivery scroll retention
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_delivery_scroll.py
          python /tmp/patch_delivery_scroll.py

      - name: Verify
        shell: bash
        run: |
          git diff --check
          grep -q "reopenProjectPreservingDetailScroll" delivery.js
          grep -q "currentDetailScrollTop" delivery.js

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "DPRO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add delivery.js
          git commit -m "Keep delivery detail scroll position after save"
          git push

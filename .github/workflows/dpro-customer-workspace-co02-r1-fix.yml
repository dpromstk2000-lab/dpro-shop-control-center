name: DPRO Customer Workspace CO02 R1 FIX

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-customer-workspace-co02-r1-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard failed-run baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD^)"
          test "$BASE" = "738b4e4d2fd16c5ec9dffd52e6a30257eafdaffe"
          test -f .github/workflows/dpro-customer-workspace-co02-r1.yml
          test ! -f customer-workspace.html
          test ! -f customer-workspace.css
          test ! -f customer-workspace.js
          grep -F 'DPRO-CC-UI-V2-PHASE3A-CROSS-DEVICE-R1-20260921' config.js
          grep -F 'items: ["start", "setup", "delivery", "ready"]' cc-shell-v2.js

      - name: Apply Customer Workspace
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/co02_customer_workspace.py
          python /tmp/co02_customer_workspace.py

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          node --check customer-workspace.js
          node --check cc-shell-v2.js
          node --check config.js

          test -f customer-workspace.html
          test -f customer-workspace.css
          test -f customer-workspace.js

          grep -F 'DPRO-CUSTOMER-WORKSPACE-CO02-R1-20260921' customer-workspace.js
          grep -F 'cc_v_customer_workspace' customer-workspace.js
          grep -F 'cc_v_customer_next_action' customer-workspace.js
          grep -F 'cc_customer_onboarding_start' customer-workspace.js
          grep -F 'cc_customer_onboarding_confirm_requirements' customer-workspace.js
          grep -F 'cc_customer_onboarding_set_hold' customer-workspace.js
          grep -F 'Supabase Project Ref' customer-workspace.html
          grep -F 'Cloudflare' customer-workspace.html
          grep -F 'Owner・承認' customer-workspace.html
          grep -F 'customer-workspace.html' cc-shell-v2.js
          grep -F 'DPRO-CC-UI-V2-CO02-CUSTOMER-WORKSPACE-R1-20260921' config.js

          # Protect unrelated areas. git status includes NEW untracked workspace files.
          while IFS= read -r line; do
            path="${line:3}"
            case "$path" in
              cc-shell-v2.js|config.js|customer-workspace.css|customer-workspace.html|customer-workspace.js)
                ;;
              *)
                echo "Unexpected changed path before workflow cleanup: $path"
                exit 1
                ;;
            esac
          done < <(git status --porcelain | grep -v '^?? .github/workflows/dpro-customer-workspace-co02-r1-fix.yml$' || true)

      - name: Remove one-shots
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/dpro-customer-workspace-co02-r1.yml
          rm -f .github/workflows/dpro-customer-workspace-co02-r1-fix.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          git diff --cached --name-only | while IFS= read -r path; do
            case "$path" in
              cc-shell-v2.js|config.js|customer-workspace.css|customer-workspace.html|customer-workspace.js|.github/workflows/dpro-customer-workspace-co02-r1.yml|.github/workflows/dpro-customer-workspace-co02-r1-fix.yml)
                ;;
              *)
                echo "Unexpected staged path: $path"
                exit 1
                ;;
            esac
          done

          git commit -m "Add customer onboarding workspace CO-02"
          git push

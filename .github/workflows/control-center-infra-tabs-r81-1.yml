name: CONTROL CENTER Infrastructure Tabs R81.1 Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write infrastructure tab fallback
        shell: python
        env:
          INFRA_TABS_JS_B64: ""
        run: |
          import os
          import base64
          from pathlib import Path

          payload = base64.b64decode(os.environ["INFRA_TABS_JS_B64"])
          Path("control-center-infra-tabs-r81.js").write_bytes(payload)

      - name: Force fresh CONTROL CENTER assets
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "config.js?v=DPRO-CC-UI-V2-PHASE2D-CACHEGUARD-R1-20260921",
              "config.js?v=CONTROL-CENTER-INFRA-TABS-R81-1-20261006"
          )
          text = text.replace(
              "app-ui-v2-phase2d-r1.js?v=DPRO-CC-UI-V2-PHASE2D-R1-20260921",
              "app-ui-v2-phase2d-r1.js?v=CONTROL-CENTER-INFRA-TABS-R81-1-20261006"
          )

          fallback = '<script defer src="control-center-infra-tabs-r81.js?v=CONTROL-CENTER-INFRA-TABS-R81-1-20261006"></script>'
          if fallback not in text:
              anchor = '<script defer src="app-ui-v2-phase2d-r1.js?v=CONTROL-CENTER-INFRA-TABS-R81-1-20261006"></script>'
              if anchor not in text:
                  raise SystemExit("app script anchor not found")
              text = text.replace(anchor, anchor + "\n  " + fallback, 1)

          path.write_text(text, encoding="utf-8")

      - name: Validate
        shell: bash
        run: |
          node --check control-center-infra-tabs-r81.js
          grep -q 'CONTROL-CENTER-INFRA-TABS-R81-1-20261006' index.html
          grep -q 'control-center-infra-tabs-r81.js' index.html
          grep -q 'data-infra-tab="workers"' index.html
          grep -q 'id="infra-panel-workers"' index.html

      - name: Remove superseded invalid R81 workflow
        shell: bash
        run: |
          rm -f .github/workflows/control-center-infra-tabs-r81.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix CONTROL CENTER infrastructure tabs R81.1"
          git push

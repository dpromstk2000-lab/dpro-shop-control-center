name: DPRO Owner Auth CSP Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Customer Workspace CSP
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_owner_auth_csp.py
          python /tmp/patch_owner_auth_csp.py

      - name: Verify diff
        run: git diff --check && git diff --stat

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "DPRO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add customer-workspace.html
          git commit -m "Allow Owner Auth Worker in Customer Workspace CSP"
          git push

name: DPRO Control Center UI V2 Phase 2D Cache Guard R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-control-center-ui-v2-phase2d-cache-guard-r1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard Phase 2D
        shell: bash
        run: |
          set -euo pipefail
          test -f app.js
          test -f index.html
          test -f config.js
          grep -F 'function dashboardClientNeedsAttention(client)' app.js
          grep -F '現在、確認が必要なお客様はいません。' app.js
          grep -F 'app.js?v=DPRO-CC-UI-V2-PHASE2D-R1-20260921' index.html
          test ! -f app-ui-v2-phase2d-r1.js

      - name: Apply cache guard
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/phase2d_cacheguard.py
          python /tmp/phase2d_cacheguard.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check app-ui-v2-phase2d-r1.js
          node --check config.js
          grep -F 'window.DPRO_CC_APP_BUILD = "DPRO-CC-UI-V2-PHASE2D-R1-20260921";' app-ui-v2-phase2d-r1.js
          grep -F 'function dashboardClientNeedsAttention(client)' app-ui-v2-phase2d-r1.js
          grep -F '現在、確認が必要なお客様はいません。' app-ui-v2-phase2d-r1.js
          grep -F 'app-ui-v2-phase2d-r1.js?v=DPRO-CC-UI-V2-PHASE2D-R1-20260921' index.html
          grep -F 'DPRO_CC_INDEX_CACHE_GUARD_PHASE2D_R1' config.js
          grep -F 'dpro_ui' config.js
          grep -F 'DPRO-CC-UI-V2-PHASE2D-CACHEGUARD-R1-20260921' config.js

          if git diff --name-only | grep -E '^contact-v1(\.|-)|^dpro-contact-' >/dev/null; then
            echo "Protected DPRO CONTACT file changed."
            exit 1
          fi

      - name: Remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/dpro-control-center-ui-v2-phase2d-cache-guard-r1.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Control Center UI cache guard"
          git push

name: DPRO Owner Activation UI Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Owner activation patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_owner_activation.py
          python /tmp/patch_owner_activation.py

      - name: Verify diff
        run: git diff --check && git diff --stat

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "DPRO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add customer-workspace.html customer-workspace.js customer-workspace.css
          git commit -m "Add secure Owner activation URL issuer"
          git push

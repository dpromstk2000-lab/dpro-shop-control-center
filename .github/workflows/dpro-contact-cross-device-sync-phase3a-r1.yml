name: DPRO Contact Cross Device Sync Phase 3A R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-contact-cross-device-sync-phase3a-r1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard current CONTACT and Control Center
        shell: bash
        run: |
          set -euo pipefail
          test -f contact-v1-notification-r1.js
          test -f contact-v1-config.js
          test -f contact-v1-sw.js
          test -f cc-shell-v2.js
          test -f config.js
          grep -F 'DPRO-CONTACT-REPLY-ALERT-PWA-R2-20260830-WEB-PUSH' contact-v1-notification-r1.js
          grep -F 'DPRO-CONTACT-1-FRONTEND-LINE-WEB-INSTAGRAM-20260830-R2-PUSH-STAGED' contact-v1-config.js
          grep -F 'DPRO-CONTACT-PWA-SW-R3.1-20260909-AUTHORITATIVE-BADGE' contact-v1-sw.js
          grep -F 'const REFRESH_MS = 30000;' cc-shell-v2.js
          grep -F 'DPRO-CC-UI-V2-PHASE2D-CACHEGUARD-R1-20260921' config.js

      - name: Apply cross-device foreground sync
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/phase3a_cross_device.py
          python /tmp/phase3a_cross_device.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check contact-v1-notification-r1.js
          node --check contact-v1-config.js
          node --check cc-shell-v2.js
          node --check config.js
          grep -F 'DPRO-CONTACT-REPLY-ALERT-PWA-R3A-20260921-CROSS-DEVICE-SYNC' contact-v1-notification-r1.js
          grep -F '8000' contact-v1-notification-r1.js
          grep -F 'window.addEventListener("focus", refreshVisibleNow);' contact-v1-notification-r1.js
          grep -F 'window.addEventListener("pageshow", refreshVisibleNow);' contact-v1-notification-r1.js
          grep -F 'DPRO-CONTACT-PWA-SW-R3.1-20260909-AUTHORITATIVE-BADGE' contact-v1-notification-r1.js
          grep -F 'DPRO-CONTACT-REPLY-ALERT-R3A-20260921' contact-v1-config.js
          grep -F 'const REFRESH_MS = 8000;' cc-shell-v2.js
          grep -F 'window.addEventListener("pageshow", refreshUnreadNow);' cc-shell-v2.js
          grep -F 'DPRO-CC-UI-V2-PHASE3A-CROSS-DEVICE-R1-20260921' config.js

          if git diff --name-only | grep -E 'contact-onboarding.*worker|contact-mail-gateway.*worker|\.sql$' >/dev/null; then
            echo "Worker or DB change detected in Phase 3A."
            exit 1
          fi

      - name: Remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/dpro-contact-cross-device-sync-phase3a-r1.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve DPRO Contact cross-device unread sync"
          git push

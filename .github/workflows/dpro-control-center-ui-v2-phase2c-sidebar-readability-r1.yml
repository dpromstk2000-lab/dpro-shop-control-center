name: DPRO Control Center UI V2 Phase 2C Sidebar Readability R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-control-center-ui-v2-phase2c-sidebar-readability-r1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard Phase 2B
        shell: bash
        run: |
          set -euo pipefail
          test -f cc-shell-v2.css
          test -f config.js
          grep -F 'DPRO-CC-UI-V2-PHASE2B-R1-20260921' config.js
          grep -F '.ccv2-nav-section-title' cc-shell-v2.css
          grep -F 'font-size:10px!important' cc-shell-v2.css
          grep -F 'font-size:13px!important' cc-shell-v2.css

      - name: Apply DPRO sidebar readability
        shell: bash
        run: |
          set -euo pipefail
          cat >> cc-shell-v2.css <<'EOF'

          /* PHASE 2-C / DPRO sidebar readability */
          .ccv2-nav-section-title{
            min-height:44px!important;
            padding:10px 10px 7px!important;
            font-size:14px!important;
            line-height:1.45!important;
            letter-spacing:.03em!important;
            color:rgba(255,255,255,.78)!important;
          }
          .ccv2-nav-section-title b{
            font-size:16px!important;
            color:rgba(255,255,255,.72)!important;
          }
          .ccv2-nav-link,
          .ccv2-nav .nav-button{
            min-height:46px!important;
            padding:9px 10px!important;
            font-size:15px!important;
            line-height:1.45!important;
            font-weight:850!important;
          }
          .ccv2-nav-icon{
            width:31px!important;
            height:31px!important;
            min-width:31px!important;
            font-size:11px!important;
          }
          .ccv2-nav-link small{
            font-size:11px!important;
            line-height:1.4!important;
          }
          .ccv2-contact-priority{
            min-height:64px!important;
            padding:11px 12px!important;
          }
          .ccv2-contact-copy strong{
            font-size:15px!important;
            line-height:1.4!important;
          }
          .ccv2-contact-copy small{
            font-size:12px!important;
            line-height:1.45!important;
            margin-top:2px!important;
          }
          .ccv2-contact-icon{
            width:36px!important;
            height:36px!important;
            min-width:36px!important;
            font-size:12px!important;
          }
          .ccv2-advanced{
            margin-top:5px!important;
            padding-top:6px!important;
          }

          @media(max-width:760px){
            .ccv2-nav-section-title{
              min-height:46px!important;
              font-size:15px!important;
            }
            .ccv2-nav-link,
            .ccv2-nav .nav-button{
              min-height:48px!important;
              font-size:15px!important;
            }
          }
          EOF

      - name: Bump sidebar cache key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("config.js")
          s = p.read_text(encoding="utf-8")
          old = "./cc-shell-v2.css?v=DPRO-CC-UI-V2-PHASE2B-R1-20260921"
          new = "./cc-shell-v2.css?v=DPRO-CC-UI-V2-PHASE2C-R1-20260921"
          if old not in s:
              raise SystemExit("CSS_CACHE_BASELINE_NOT_FOUND")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check config.js
          grep -F 'PHASE 2-C / DPRO sidebar readability' cc-shell-v2.css
          grep -F 'font-size:14px!important' cc-shell-v2.css
          grep -F 'font-size:15px!important' cc-shell-v2.css
          grep -F 'DPRO-CC-UI-V2-PHASE2C-R1-20260921' config.js

          if git diff --name-only | grep -E '^contact-v1(\.|-)|^dpro-contact-' >/dev/null; then
            echo "Protected DPRO CONTACT file changed."
            exit 1
          fi

      - name: Remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/dpro-control-center-ui-v2-phase2c-sidebar-readability-r1.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve Control Center sidebar readability"
          git push

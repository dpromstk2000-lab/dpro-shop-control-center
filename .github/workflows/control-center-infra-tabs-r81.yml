name: CONTROL CENTER Infrastructure Tabs R81 Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch cache keys and infrastructure tab fallback
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          app = Path('app-ui-v2-phase2d-r1.js')
          config = Path('config.js')

          index_text = index.read_text(encoding='utf-8')
          app_text = app.read_text(encoding='utf-8')
          config_text = config.read_text(encoding='utf-8')

          old_build = 'DPRO-CC-UI-V2-PHASE2D-R1-20260921'
          new_build = 'DPRO-CC-UI-V2-PHASE2D-R2-20261006'
          old_guard = 'DPRO-CC-UI-V2-PHASE2D-CACHEGUARD-R1-20260921'
          new_guard = 'DPRO-CC-UI-V2-PHASE2D-CACHEGUARD-R2-20261006'

          # Force browser to fetch the current application and config files.
          index_text = index_text.replace(
              'config.js?v=' + old_guard,
              'config.js?v=' + new_guard
          )
          index_text = index_text.replace(
              'app-ui-v2-phase2d-r1.js?v=' + old_build,
              'app-ui-v2-phase2d-r1.js?v=' + new_build
          )

          app_text = app_text.replace(
              'window.DPRO_CC_APP_BUILD = "' + old_build + '";',
              'window.DPRO_CC_APP_BUILD = "' + new_build + '";',
              1
          )

          config_text = config_text.replace(
              'const expectedBuild = "' + old_build + '";',
              'const expectedBuild = "' + new_build + '";'
          )
          config_text = config_text.replace(
              'const reloadKey = "phase2d-r1-20260921";',
              'const reloadKey = "phase2d-r2-20261006";'
          )

          marker = 'CONTROL CENTER INFRA TAB FALLBACK R81 / 2026-10-06'
          if marker not in app_text:
              addon = r'''

/* CONTROL CENTER INFRA TAB FALLBACK R81 / 2026-10-06
 * Capture-phase fallback for Infrastructure tabs.
 * This is intentionally independent from the main app closure so a stale/raced
 * event binding cannot leave the Worker/Supabase/GitHub tabs inert.
 */
(() => {
  "use strict";
  const VERSION = "CONTROL-CENTER-INFRA-TABS-R81-20261006";
  if (window.__DPRO_CC_INFRA_TABS_R81__ === VERSION) return;
  window.__DPRO_CC_INFRA_TABS_R81__ = VERSION;

  const VALID = new Set(["systems", "supabase", "workers", "github", "releases", "health"]);

  function show(tab, updateUrl = true) {
    if (!VALID.has(tab)) return false;
    document.querySelectorAll(".infrastructure-tab").forEach((button) => {
      const active = button.dataset.infraTab === tab;
      button.classList.toggle("active", active);
      button.setAttribute("aria-selected", active ? "true" : "false");
    });
    document.querySelectorAll(".infra-panel").forEach((panel) => panel.classList.add("hidden"));
    const target = document.getElementById(`infra-panel-${tab}`);
    if (!target) return false;
    target.classList.remove("hidden");
    if (updateUrl) {
      const url = new URL(location.href);
      url.searchParams.set("infra_tab", tab);
      history.replaceState(null, "", url.pathname + url.search + location.hash);
    }
    document.documentElement.dataset.ccInfraTab = tab;
    return true;
  }

  document.addEventListener("click", (event) => {
    const button = event.target.closest?.(".infrastructure-tab[data-infra-tab]");
    if (!button) return;
    const tab = button.dataset.infraTab || "";
    if (!VALID.has(tab)) return;
    show(tab, true);
  }, true);

  function restore() {
    const params = new URLSearchParams(location.search);
    const tab = params.get("infra_tab");
    if (VALID.has(tab)) show(tab, false);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", restore, { once: true });
  } else {
    restore();
  }
})();
'''
              app_text = app_text.rstrip() + addon + '\n'

          index.write_text(index_text, encoding='utf-8')
          app.write_text(app_text, encoding='utf-8')
          config.write_text(config_text, encoding='utf-8')

      - name: Validate patch
        shell: bash
        run: |
          node --check app-ui-v2-phase2d-r1.js
          node --check config.js
          grep -q 'DPRO-CC-UI-V2-PHASE2D-R2-20261006' index.html
          grep -q 'DPRO-CC-UI-V2-PHASE2D-R2-20261006' app-ui-v2-phase2d-r1.js
          grep -q 'CONTROL CENTER INFRA TAB FALLBACK R81 / 2026-10-06' app-ui-v2-phase2d-r1.js
          grep -q 'phase2d-r2-20261006' config.js

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html config.js app-ui-v2-phase2d-r1.js
          git commit -m "Fix CONTROL CENTER infrastructure tabs R81"
          git push

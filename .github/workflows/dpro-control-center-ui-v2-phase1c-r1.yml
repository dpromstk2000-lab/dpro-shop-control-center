name: DPRO Control Center UI V2 Phase 1C R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-control-center-ui-v2-phase1c-r1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard Phase 1B
        shell: bash
        run: |
          set -euo pipefail
          test -f cc-shell-v2.js
          test -f cc-shell-v2.css
          grep -F 'phase1b' cc-shell-v2.js
          grep -F 'PHASE 1-B' cc-shell-v2.css
          grep -F 'cc-shell-v2.js?v=DPRO-CC-UI-V2-PHASE1-R1-20260921' config.js

      - name: Fix accordion CSS
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d >> cc-shell-v2.css

      - name: Bump shell cache key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("config.js")
          s = p.read_text(encoding="utf-8")
          old_css = "./cc-shell-v2.css?v=DPRO-CC-UI-V2-PHASE1-R1-20260921"
          old_js = "./cc-shell-v2.js?v=DPRO-CC-UI-V2-PHASE1-R1-20260921"
          new_css = "./cc-shell-v2.css?v=DPRO-CC-UI-V2-PHASE1C-R1-20260921"
          new_js = "./cc-shell-v2.js?v=DPRO-CC-UI-V2-PHASE1C-R1-20260921"
          if old_css not in s or old_js not in s:
              raise SystemExit("CACHE_KEY_BASELINE_NOT_FOUND")
          s = s.replace(old_css, new_css, 1)
          s = s.replace(old_js, new_js, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check config.js
          node --check cc-shell-v2.js
          grep -F 'PHASE 1-C / accordion display fix' cc-shell-v2.css
          grep -F 'max-height:0!important' cc-shell-v2.css
          grep -F 'DPRO-CC-UI-V2-PHASE1C-R1-20260921' config.js
          if git diff --name-only | grep -E '^contact-v1(\.|-)|^dpro-contact-' >/dev/null; then
            echo "Protected DPRO CONTACT file changed."
            exit 1
          fi

      - name: Remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/dpro-control-center-ui-v2-phase1c-r1.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Control Center UI V2 accordion"
          git push

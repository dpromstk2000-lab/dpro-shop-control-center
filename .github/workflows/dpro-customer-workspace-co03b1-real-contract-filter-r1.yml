name: DPRO Customer Workspace CO03B1 Real Contract Filter R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-customer-workspace-co03b1-real-contract-filter-r1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD^)"
          test "$BASE" = "233d44c3425f8ad6fbe0b3064c7dcde214eb5a84"
          grep -F 'DPRO-CUSTOMER-WORKSPACE-CO03B-SETUP-WIZARD-R1-20260921' customer-workspace.js
          grep -F 'const rows = state.projects.filter((p) => p.contract_id && p.status !== "cancelled");' customer-workspace.js

      - name: Apply
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/co03b1.py
          python /tmp/co03b1.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check customer-workspace.js
          grep -F 'client.is_demo !== true' customer-workspace.js
          grep -F 'デモ・開発案件は表示しません' customer-workspace.js
          grep -F 'DPRO-CUSTOMER-WORKSPACE-CO03B1-REAL-CONTRACT-FILTER-R1-20260921' customer-workspace.js
          grep -F 'CO03B1-REAL-CONTRACT-FILTER-R1-20260921' customer-workspace.html

          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(printf 'customer-workspace.html\ncustomer-workspace.js')"
          test "$CHANGED" = "$EXPECTED"

      - name: Remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/dpro-customer-workspace-co03b1-real-contract-filter-r1.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Hide demo projects from customer onboarding candidates"
          git push

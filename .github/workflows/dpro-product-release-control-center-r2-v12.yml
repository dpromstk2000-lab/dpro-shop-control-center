name: DPRO Product Release Control Center R2 V1.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-product-release-control-center-r2-v12.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard current R1.1 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f product-release-package.html
          test -f product-release-package.js
          test -f product-release-package.css
          grep -F 'DPRO-PRODUCT-RELEASE-CC-R1.1-20260921' product-release-package.js
          grep -F 'PRODUCT-RELEASE-START-R1' product-release-package.js
          grep -F 'DPRO_PRODUCT_RELEASE_MASTER_V1.1' product-release-package.js
          grep -F 'PRODUCT RELEASE V1.1' product-release-package.html
          test ! -f product-release-master-v1-2.js

      - name: Apply MASTER V1.2 Control Center
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/dpro_product_release_r2.py
          python /tmp/dpro_product_release_r2.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check product-release-master-v1-2.js
          node --check product-release-package.js
          grep -F 'DPRO-PRODUCT-RELEASE-CC-R2-20260921' product-release-package.js
          grep -F 'PRODUCT-RELEASE-START-R2' product-release-package.js
          grep -F 'DPRO_PRODUCT_RELEASE_MASTER_V1.2' product-release-package.js
          grep -F 'DPRO-PRODUCT-RELEASE-RETURN-R2' product-release-package.js
          grep -F 'cc_product_release_begin_reaudit' product-release-package.js
          grep -F 'cc_product_release_validate_return_v2' product-release-package.js
          grep -F 'HUMAN ACCEPTANCE' product-release-package.js
          grep -F 'MASTER V1.2' product-release-package.html
          grep -F 'V1.2再監査を開始' product-release-package.html
          grep -F 'product-release-master-v1-2.js' product-release-package.html
          grep -F '18_QA_ASSERTION_POLICY.json' product-release-master-v1-2.js
          grep -F '25_CONTROL_CENTER_GUARD_REQUIREMENTS.json' product-release-master-v1-2.js

          if git diff --name-only | grep -E '^contact-v1|^contact-onboarding|\.sql$' >/dev/null; then
            echo "Protected CONTACT/DB file changed."
            exit 1
          fi

      - name: Remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/dpro-product-release-control-center-r2-v12.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade Product Release Control Center to MASTER V1.2"
          git push

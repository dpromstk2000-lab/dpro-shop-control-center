name: DPRO Control Center UI V2 Phase 2D Attention Accuracy R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-control-center-ui-v2-phase2d-attention-accuracy-r1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard Phase 2C
        shell: bash
        run: |
          set -euo pipefail
          test -f app.js
          test -f index.html
          grep -F 'DPRO-CC-UI-V2-PHASE2C-R1-20260921' config.js
          grep -F 'app.js?v=DPRO-CC-UI-V2-PHASE2B-R1-20260921' index.html
          grep -F 'function renderDashboardClients()' app.js
          grep -F '顧客が登録されていません。' app.js

      - name: Apply attention accuracy
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/phase2d_patch.py
          python /tmp/phase2d_patch.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          grep -F 'function dashboardClientNeedsAttention(client)' app.js
          grep -F 'function dashboardClientPriority(client)' app.js
          grep -F 'function dashboardClientReason(client)' app.js
          grep -F '.filter(dashboardClientNeedsAttention)' app.js
          grep -F '現在、確認が必要なお客様はいません。' app.js
          grep -F 'app.js?v=DPRO-CC-UI-V2-PHASE2D-R1-20260921' index.html

          if git diff --name-only | grep -E '^contact-v1(\.|-)|^dpro-contact-' >/dev/null; then
            echo "Protected DPRO CONTACT file changed."
            exit 1
          fi

      - name: Remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/dpro-control-center-ui-v2-phase2d-attention-accuracy-r1.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve Control Center attention accuracy"
          git push

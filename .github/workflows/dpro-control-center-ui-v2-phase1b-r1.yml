name: DPRO Control Center UI V2 Phase 1B R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-control-center-ui-v2-phase1b-r1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard Phase 1
        shell: bash
        run: |
          set -euo pipefail
          test -f cc-shell-v2.js
          test -f cc-shell-v2.css
          grep -F 'DPRO-CC-UI-V2-PHASE1-R1-20260921' cc-shell-v2.js
          grep -F 'window.DPRO_CC_SHELL_V2_ACTIVE = true;' config.js

      - name: Apply Phase 1B
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > cc-shell-v2.js
          printf '%s' '' | base64 -d > cc-shell-v2.css
          cat > CONTROL_CENTER_UI_V2_PHASE1B.txt <<'EOF'
DPRO CONTROL CENTER UI V2 / PHASE 1B
DATE: 2026-09-21
- 顧客対応は常時固定
- ホームは常時表示
- お客様 / 導入・運用 / DPRO製品 / 品質・管理をaccordion化
- 現在の領域だけ自動展開
- 古いsidebar-note / versionを表側から整理
- 重複した接続確認リンクを整理
- ログアウトは維持
- DPRO CONTACT PWA / DB / Workerは変更なし
EOF

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check cc-shell-v2.js
          grep -F 'currentSectionKey' cc-shell-v2.js
          grep -F 'phase1b' cc-shell-v2.js
          grep -F 'PHASE 1-B' cc-shell-v2.css
          if git diff --name-only | grep -E '^contact-v1(\.|-)|^dpro-contact-' >/dev/null; then
            echo "Protected DPRO CONTACT file changed."
            exit 1
          fi

      - name: Remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/dpro-control-center-ui-v2-phase1b-r1.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Brush up Control Center UI V2 navigation"
          git push

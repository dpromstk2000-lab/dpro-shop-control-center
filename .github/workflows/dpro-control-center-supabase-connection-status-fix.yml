name: DPRO Control Center Supabase Connection Status Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Supabase connection status save
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_supabase_status.py
          python /tmp/patch_supabase_status.py

      - name: Verify
        run: |
          git diff --check
          grep -q 'connection_status:inviteStatus==="accepted" ? "connected" : "waiting"' customer-workspace.js

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "DPRO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add customer-workspace.js
          git commit -m "Persist Supabase connection status after accepted invite"
          git push

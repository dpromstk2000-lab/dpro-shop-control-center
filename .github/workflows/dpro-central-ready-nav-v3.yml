name: DPRO CENTRAL READY Navigation Integration V3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "dpro-central-ready-nav-v3-${{ github.repository }}"
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Repository guard
        shell: bash
        run: |
          if [ "$GITHUB_REPOSITORY" != "dpromstk2000-lab/dpro-shop-control-center" ]; then
            echo "Wrong repository" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add READY navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("config.js")
          s = p.read_text(encoding="utf-8")
          before = s

          ready_function = """  const installReadyLink = (nav) => {
            if (document.body?.dataset.ccReadyPage === "true") return true;
            if (nav.querySelector("[data-cc-ready-link]")) return true;
            const link = document.createElement("a");
            link.href = "ready-control-center.html";
            link.className = "nav-button cc-addon-link";
            link.dataset.ccReadyLink = "true";
            link.innerHTML = "<span>準</span>READY運用センター";
            link.setAttribute("aria-label", "DPRO READY運用センターを開く");
            const setupLink = nav.querySelector("[data-cc15-setup-link]");
            if (setupLink) setupLink.insertAdjacentElement("afterend", link);
            else {
              const contractButton = nav.querySelector('[data-view="contracts"]');
              if (contractButton) contractButton.insertAdjacentElement("afterend", link);
              else nav.appendChild(link);
            }
            return true;
          };

          """

          if "data-cc-ready-link" not in s:
              marker = "  const installCenter7DeliveryQuality = () => {"
              if marker not in s:
                  raise SystemExit("READY NAV V3: function insertion anchor not found")
              s = s.replace(marker, ready_function + marker, 1)

          if "const ready = installReadyLink(nav);" not in s:
              setup_line = "    const setup = installSetupLink(nav);"
              if setup_line not in s:
                  raise SystemExit("READY NAV V3: installSetupLink call not found")
              s = s.replace(
                  setup_line,
                  setup_line + "\n    const ready = installReadyLink(nav);",
                  1,
              )

          expected_return = "    return delivery && setup && ready && start && contact && monitor;"
          if expected_return not in s:
              old_return = "    return delivery && setup && start && contact && monitor;"
              if old_return not in s:
                  raise SystemExit("READY NAV V3: installLinks return anchor not found")
              s = s.replace(old_return, expected_return, 1)

          required = [
              'data-cc-ready-link',
              'ready-control-center.html',
              'READY運用センター',
              'const ready = installReadyLink(nav);',
              'return delivery && setup && ready && start && contact && monitor;',
          ]
          missing = [token for token in required if token not in s]
          if missing:
              raise SystemExit("READY NAV V3: missing tokens: " + ", ".join(missing))

          if s != before:
              p.write_text(s, encoding="utf-8")
              print("READY NAV V3 patch: APPLIED")
          else:
              print("READY NAV V3 patch: ALREADY_APPLIED")
          PY

      - name: Static QA
        shell: bash
        run: |
          grep -q 'data-cc-ready-link' config.js
          grep -q 'ready-control-center.html' config.js
          grep -q 'READY運用センター' config.js
          grep -q 'const ready = installReadyLink(nav);' config.js
          grep -q 'return delivery && setup && ready && start && contact && monitor;' config.js
          test -f ready-control-center.html
          test -f ready-control-center.js
          echo "READY NAV V3 static QA: PASS"

      - name: Commit forward-only integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.js
          if git diff --cached --quiet; then
            echo "No config.js changes required."
            exit 0
          fi
          git commit -m "Integrate READY operation center navigation V3"
          git push

name: DPRO Customer Workspace CO04B Verification UI R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-customer-workspace-co04b-verification-ui-r1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD^)"
          test "$BASE" = "d0e60eb2d9a52074805ded86252e5c43af0ecea3"
          grep -F 'DPRO-CUSTOMER-WORKSPACE-CO03B1-REAL-CONTRACT-FILTER-R1-20260921' customer-workspace.js
          grep -F 'id="setupWizardBlock"' customer-workspace.html
          ! grep -F 'id="verificationBlock"' customer-workspace.html

      - name: Apply CO04B
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/co04b_patch.py
          python /tmp/co04b_patch.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check customer-workspace.js
          grep -F 'DPRO-CUSTOMER-WORKSPACE-CO04B-VERIFICATION-UI-R1-20260921' customer-workspace.js
          grep -F 'cc_customer_onboarding_environment_verification' customer-workspace.js
          grep -F 'id="verificationBlock"' customer-workspace.html
          grep -F '未確認・古い結果をPASSにはしません' customer-workspace.html
          grep -F '.verification-block' customer-workspace.css
          grep -F 'CO04B-VERIFICATION-UI-R1-20260921' customer-workspace.html

          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(printf 'customer-workspace.css\ncustomer-workspace.html\ncustomer-workspace.js')"
          test "$CHANGED" = "$EXPECTED"

          if git diff --name-only | grep -E '^contact-v1|^product-release-package|\.sql$|^worker|^contact-onboarding' >/dev/null; then
            echo "Protected area changed."
            git diff --name-only
            exit 1
          fi

      - name: Remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/dpro-customer-workspace-co04b-verification-ui-r1.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add customer environment verification UI CO-04B"
          git push

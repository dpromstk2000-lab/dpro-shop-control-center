)

old_gates = 'required_gates:{initial_publish:true,brushup_4_of_4:true,human_acceptance:true,final_release_4_of_4:true,deploy_attestation_4_way:true,open_blocker_high_zero:true},'
new_gates = 'required_gates:{initial_publish:true,brushup_4_of_4:true,human_acceptance:true,history_preservation_assessment:true,history_preservation_if_applicable:true,final_release_4_of_4:true,deploy_attestation_4_way:true,open_blocker_high_zero:true},'
if old_gates not in s:

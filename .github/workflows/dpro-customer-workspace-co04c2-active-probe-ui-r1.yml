name: DPRO Customer Workspace CO04C2 Active Probe UI R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-customer-workspace-co04c2-active-probe-ui-r1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD^)"
          test "$BASE" = "70e6196f21a7439ccfb4abe60e4202d176f626d1"
          grep -F 'DPRO-CUSTOMER-WORKSPACE-CO04B-VERIFICATION-UI-R1-20260921' customer-workspace.js
          grep -F 'id="verificationBlock"' customer-workspace.html
          ! grep -F 'id="runActiveVerificationButton"' customer-workspace.html

      - name: Apply CO04C2
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/co04c2_patch.py
          python /tmp/co04c2_patch.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check customer-workspace.js
          grep -F 'DPRO-CUSTOMER-WORKSPACE-CO04C2-ACTIVE-PROBE-UI-R1-20260921' customer-workspace.js
          grep -F 'dpro-customer-env-probe' customer-workspace.js
          grep -F 'id="runActiveVerificationButton"' customer-workspace.html
          grep -F '実チェックを実行' customer-workspace.html
          grep -F '.verification-head-actions' customer-workspace.css
          grep -F 'CO04C2-ACTIVE-PROBE-UI-R1-20260921' customer-workspace.html

          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(printf 'customer-workspace.css\ncustomer-workspace.html\ncustomer-workspace.js')"
          test "$CHANGED" = "$EXPECTED"

          if git diff --name-only | grep -E '^contact-v1|^product-release-package|\.sql$|^worker|^contact-onboarding' >/dev/null; then
            echo "Protected area changed."
            git diff --name-only
            exit 1
          fi

      - name: Remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/dpro-customer-workspace-co04c2-active-probe-ui-r1.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Connect active customer environment probe CO-04C"
          git push

name: DPRO Control Center UI V2 Phase 1 R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-control-center-ui-v2-phase1-r1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard audited baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f config.js
          grep -F 'version: "CONTROL-CENTER-45-CENTER10-UI-1-R2-GLOBAL-READABILITY-20260810"' config.js
          grep -F 'contactApiBaseUrl: "https://dpro-shop-contact-api.dpromstk2000.workers.dev"' config.js
          test ! -f cc-shell-v2.js
          test ! -f cc-shell-v2.css

      - name: Write UI V2 Phase 1 files
        shell: bash
        run: |
          set -euo pipefail
          cat > cc-shell-v2.js <<'EOF_JS'
(() => {
  "use strict";

  const VERSION = "DPRO-CC-UI-V2-PHASE1-R1-20260921";
  const CONTACT_URL = "contact-v1.html";
  const SESSION_KEY = "dpro-control-center-auth-v1";
  const REFRESH_MS = 30000;

  if (document.body?.dataset?.dproContactPage === "true" || /\/contact-v1\.html$/i.test(location.pathname)) return;

  const state = {
    originalTitle: document.title,
    unread: 0,
    timer: null,
    navReady: false,
  };

  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
  const pageName = () => (location.pathname.split("/").pop() || "index.html").toLowerCase();

  const readAccessToken = () => {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return "";
      const data = JSON.parse(raw);
      return String(
        data?.access_token ||
        data?.accessToken ||
        data?.session?.access_token ||
        data?.currentSession?.access_token ||
        data?.data?.session?.access_token ||
        ""
      ).trim();
    } catch (_) {
      return "";
    }
  };

  const links = {
    home: { href: "index.html", icon: "⌂", label: "ホーム" },
    clients: { href: "index.html#view-clients", icon: "顧", label: "顧客一覧", view: "clients" },
    contracts: { href: "index.html#view-contracts", icon: "契", label: "契約・サービス", view: "contracts" },
    line: { href: "index.html#view-line", icon: "LINE", label: "LINE公式運用", view: "line" },
    websites: { href: "index.html#view-websites", icon: "WEB", label: "ホームページ", view: "websites" },

    start: { href: "start.html", icon: "始", label: "契約開始" },
    setup: { href: "setup.html", icon: "設", label: "契約セットアップ" },
    delivery: { href: "delivery.html", icon: "納", label: "制作・納品" },
    ready: { href: "ready-control-center.html", icon: "準", label: "本番準備", sub: "READY" },

    products: { href: "index.html#view-products", icon: "製", label: "DPRO製品一覧", view: "products" },
    productDev: { href: "product-development.html", icon: "新", label: "新しい製品を作る" },
    productRelease: { href: "product-release-package.html", icon: "販", label: "商品として公開" },

    master: { href: "master-standard.html", icon: "基", label: "DPRO基準", sub: "MASTER" },
    factory: { href: "factory-v2.html", icon: "品", label: "FACTORY品質", sub: "V2" },
    check: { href: "system-check.html", icon: "✓", label: "接続確認" },
    monitor: { href: "monitor.html", icon: "監", label: "自社サイト監視" },
    artifacts: { href: "artifacts.html", icon: "保", label: "保管資料" },
  };

  const sections = [
    { title: "ホーム", items: ["home"] },
    { title: "お客様", items: ["clients", "contracts", "line", "websites"] },
    { title: "導入・運用", items: ["start", "setup", "delivery", "ready"] },
    { title: "DPRO製品", items: ["products", "productDev", "productRelease"] },
    { title: "品質・管理", items: ["master", "factory", "check", "monitor", "artifacts"] },
  ];

  const currentKey = () => {
    const p = pageName();
    if (p === "start.html") return "start";
    if (p === "setup.html") return "setup";
    if (p === "delivery.html") return "delivery";
    if (p === "ready-control-center.html") return "ready";
    if (p === "product-development.html") return "productDev";
    if (p === "product-release-package.html") return "productRelease";
    if (p === "master-standard.html") return "master";
    if (p === "factory-v2.html" || p === "factory-v2-prebuild.html") return "factory";
    if (p === "system-check.html") return "check";
    if (p === "monitor.html" || p === "monitor-center.html") return "monitor";
    if (p === "artifacts.html") return "artifacts";
    if (p === "index.html" || p === "") {
      const h = location.hash.replace(/^#view-/, "");
      if (["clients","contracts","line","websites","products"].includes(h)) return h;
      return "home";
    }
    return "";
  };

  const makeIcon = (text) => {
    const i = document.createElement("span");
    i.className = "ccv2-nav-icon";
    i.textContent = text;
    return i;
  };

  const makeStaticLink = (key) => {
    const meta = links[key];
    const a = document.createElement("a");
    a.href = meta.href;
    a.className = "ccv2-nav-link";
    a.dataset.ccv2Key = key;
    if (currentKey() === key) a.classList.add("is-active");
    a.append(makeIcon(meta.icon));
    const label = document.createElement("span");
    label.className = "ccv2-nav-label";
    label.textContent = meta.label;
    a.append(label);
    if (meta.sub) {
      const sub = document.createElement("small");
      sub.textContent = meta.sub;
      a.append(sub);
    }
    return a;
  };

  const relabelIndexButton = (button, key) => {
    const meta = links[key];
    if (!button || !meta) return null;
    button.dataset.ccv2Key = key;
    button.innerHTML = "";
    button.append(makeIcon(meta.icon));
    const label = document.createElement("span");
    label.className = "ccv2-nav-label";
    label.textContent = meta.label;
    button.append(label);
    return button;
  };

  const makeSection = (title) => {
    const box = document.createElement("div");
    box.className = "ccv2-nav-section";
    const head = document.createElement("div");
    head.className = "ccv2-nav-section-title";
    head.textContent = title;
    box.append(head);
    return box;
  };

  const makePriorityContact = () => {
    const a = document.createElement("a");
    a.href = CONTACT_URL;
    a.className = "ccv2-contact-priority";
    a.setAttribute("aria-label", "顧客対応を開く");
    a.innerHTML = `
      <span class="ccv2-contact-icon">話</span>
      <span class="ccv2-contact-copy"><strong>顧客対応</strong><small>問い合わせを確認</small></span>
      <span class="ccv2-contact-badge" data-ccv2-contact-badge hidden>0</span>
    `;
    return a;
  };

  const normalizeIndexNav = (nav) => {
    const buttons = {};
    ["dashboard","clients","contracts","line","websites","products"].forEach((view) => {
      buttons[view] = nav.querySelector(`.nav-button[data-view="${view}"]`);
    });

    const keepMap = {
      home: relabelIndexButton(buttons.dashboard, "home"),
      clients: relabelIndexButton(buttons.clients, "clients"),
      contracts: relabelIndexButton(buttons.contracts, "contracts"),
      line: relabelIndexButton(buttons.line, "line"),
      websites: relabelIndexButton(buttons.websites, "websites"),
      products: relabelIndexButton(buttons.products, "products"),
    };

    const advanced = ["systems","tasks","support","security"]
      .map((view) => nav.querySelector(`.nav-button[data-view="${view}"]`))
      .filter(Boolean);

    nav.innerHTML = "";
    nav.classList.add("ccv2-nav");
    nav.append(makePriorityContact());

    for (const section of sections) {
      const box = makeSection(section.title);
      for (const key of section.items) {
        const node = keepMap[key] || makeStaticLink(key);
        if (node) box.append(node);
      }
      nav.append(box);
    }

    if (advanced.length) {
      const box = makeSection("その他");
      box.classList.add("ccv2-advanced");
      for (const button of advanced) {
        const view = button.dataset.view;
        const labels = {
          systems: ["SYS","DPROシステム"],
          tasks: ["✓","タスク・確認待ち"],
          support: ["支","サポート案件"],
          security: ["鍵","コード復旧・一時サポート"],
        };
        const [icon,labelText] = labels[view] || ["・", view];
        button.innerHTML = "";
        button.append(makeIcon(icon));
        const label = document.createElement("span");
        label.className = "ccv2-nav-label";
        label.textContent = labelText;
        button.append(label);
        box.append(button);
      }
      nav.append(box);
    }
  };

  const normalizeStaticNav = (nav) => {
    nav.innerHTML = "";
    nav.classList.add("ccv2-nav");
    nav.append(makePriorityContact());
    for (const section of sections) {
      const box = makeSection(section.title);
      for (const key of section.items) box.append(makeStaticLink(key));
      nav.append(box);
    }
  };

  const buildDrawer = () => {
    if ($("#ccv2Drawer")) return;
    const drawer = document.createElement("div");
    drawer.id = "ccv2Drawer";
    drawer.className = "ccv2-drawer";
    drawer.setAttribute("aria-hidden", "true");

    const panel = document.createElement("aside");
    panel.className = "ccv2-drawer-panel";
    const head = document.createElement("div");
    head.className = "ccv2-drawer-head";
    head.innerHTML = `<strong>DPRO SHOP</strong><button type="button" data-ccv2-drawer-close aria-label="メニューを閉じる">×</button>`;
    panel.append(head);

    const nav = document.createElement("nav");
    nav.className = "ccv2-nav";
    nav.append(makePriorityContact());
    for (const section of sections) {
      const box = makeSection(section.title);
      for (const key of section.items) box.append(makeStaticLink(key));
      nav.append(box);
    }
    panel.append(nav);
    drawer.append(panel);
    drawer.addEventListener("click", (event) => {
      if (event.target === drawer || event.target.closest("[data-ccv2-drawer-close]")) closeDrawer();
    });
    document.body.append(drawer);
  };

  const openDrawer = () => {
    buildDrawer();
    const drawer = $("#ccv2Drawer");
    drawer.classList.add("is-open");
    drawer.setAttribute("aria-hidden", "false");
  };

  const closeDrawer = () => {
    const drawer = $("#ccv2Drawer");
    if (!drawer) return;
    drawer.classList.remove("is-open");
    drawer.setAttribute("aria-hidden", "true");
  };

  const installFallbackMenuButton = () => {
    if ($("#ccv2FallbackMenu")) return;
    const existingSidebar = $("#sidebar") || $(".sidebar") || $(".cc9-sidebar");
    if (existingSidebar) return;
    const button = document.createElement("button");
    button.id = "ccv2FallbackMenu";
    button.className = "ccv2-fallback-menu";
    button.type = "button";
    button.innerHTML = "<span>D</span> メニュー";
    button.addEventListener("click", openDrawer);
    document.body.append(button);
  };

  const installNav = () => {
    if (state.navReady) return;
    const nav =
      $(".side-nav") ||
      $("#sidebar nav") ||
      $(".sidebar nav") ||
      $(".cc9-sidebar nav");

    if (nav) {
      if (nav.classList.contains("side-nav")) normalizeIndexNav(nav);
      else normalizeStaticNav(nav);
      state.navReady = true;
    } else {
      buildDrawer();
      installFallbackMenuButton();
      state.navReady = true;
    }
  };

  const installHeaderContact = () => {
    if ($("[data-ccv2-header-contact]")) return;
    const header = $(".topbar") || $(".cc9-topbar");
    const a = document.createElement("a");
    a.href = CONTACT_URL;
    a.dataset.ccv2HeaderContact = "true";
    a.className = "ccv2-header-contact";
    a.innerHTML = `<span>顧客対応</span><b data-ccv2-contact-badge hidden>0</b>`;
    a.setAttribute("aria-label", "顧客対応を開く");

    if (header) {
      const staff = $(".staff-chip", header) || $(".cc9-staff", header);
      if (staff) header.insertBefore(a, staff);
      else header.append(a);
    } else {
      a.classList.add("ccv2-header-contact-floating");
      document.body.append(a);
    }
  };

  const ensureDeepLink = () => {
    if (pageName() !== "index.html") return;
    const view = location.hash.replace(/^#view-/, "");
    if (!view) return;
    const button = document.querySelector(`.nav-button[data-view="${CSS.escape(view)}"]`);
    if (!button) return;
    setTimeout(() => button.click(), 150);
  };

  const updateUnread = (count) => {
    const n = Math.max(0, Number(count) || 0);
    state.unread = n;
    $$("[data-ccv2-contact-badge]").forEach((badge) => {
      badge.textContent = String(n);
      badge.hidden = n <= 0;
    });
    $$(".ccv2-contact-priority").forEach((link) => {
      link.classList.toggle("has-unread", n > 0);
      link.setAttribute("aria-label", n > 0 ? `顧客対応、先方から返信 ${n}件` : "顧客対応を開く");
    });
    $$("[data-ccv2-header-contact]").forEach((link) => {
      link.classList.toggle("has-unread", n > 0);
      link.setAttribute("aria-label", n > 0 ? `顧客対応、先方から返信 ${n}件` : "顧客対応を開く");
    });
    const base = state.originalTitle.replace(/^\(\d+\)\s*/, "");
    document.title = n > 0 ? `(${n}) ${base}` : base;
  };

  const fetchUnread = async () => {
    const cfg = window.DPRO_CONTROL_CENTER_CONFIG || {};
    const base = String(cfg.contactApiBaseUrl || "").replace(/\/$/, "");
    const token = readAccessToken();
    if (!base || !token) {
      updateUnread(0);
      return;
    }
    try {
      const response = await fetch(`${base}/api/contact/threads`, {
        headers: {
          "content-type": "application/json",
          authorization: `Bearer ${token}`,
        },
        cache: "no-store",
      });
      if (!response.ok) return;
      const data = await response.json().catch(() => ({}));
      const threads = Array.isArray(data?.threads) ? data.threads : [];
      const count = threads.filter((thread) => {
        const unread = Number(thread?.unreadCount ?? thread?.unread_count ?? 0);
        const direction = String(thread?.lastMessageDirection ?? thread?.last_message_direction ?? "").toLowerCase();
        return unread > 0 && direction !== "outbound";
      }).length;
      updateUnread(count);
    } catch (_) {
      // Badge is helpful but must never block CONTROL CENTER.
    }
  };

  const installUnreadSync = () => {
    fetchUnread();
    clearInterval(state.timer);
    state.timer = setInterval(() => {
      if (!document.hidden) fetchUnread();
    }, REFRESH_MS);

    window.addEventListener("focus", fetchUnread);
    window.addEventListener("online", fetchUnread);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) fetchUnread();
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.addEventListener("message", (event) => {
        const data = event.data || {};
        if (data.type === "DPRO_CONTACT_STATE_SYNC" && data.badgeCount != null) {
          updateUnread(data.badgeCount);
        }
      });
    }
  };

  const boot = () => {
    document.documentElement.dataset.ccUiV2 = "phase1";
    installNav();
    installHeaderContact();
    installFallbackMenuButton();
    ensureDeepLink();
    installUnreadSync();
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }
})();

EOF_JS

          cat > cc-shell-v2.css <<'EOF_CSS'
/* DPRO CONTROL CENTER UI V2 / PHASE 1
   Navigation + contact priority only.
   DPRO CONTACT PWA is intentionally excluded. */
:root{
  --ccv2-green:#0b5f49;--ccv2-green-dark:#064638;--ccv2-green-soft:#e8f5ef;
  --ccv2-border:#d8e5df;--ccv2-alert:#cf2f2f;--ccv2-alert-soft:#fff0f0;
}
.ccv2-nav{display:flex!important;flex-direction:column!important;gap:8px!important}
.ccv2-contact-priority{
  display:flex!important;align-items:center!important;gap:10px!important;min-height:58px!important;
  padding:10px 12px!important;margin:0 0 8px!important;border-radius:14px!important;text-decoration:none!important;
  background:rgba(255,255,255,.11)!important;color:#fff!important;border:1px solid rgba(255,255,255,.12)!important
}
.ccv2-contact-priority:hover{background:rgba(255,255,255,.17)!important}
.ccv2-contact-priority.has-unread{background:#fff!important;color:var(--ccv2-green-dark)!important;border-color:#fff!important}
.ccv2-contact-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(159,227,189,.22);font-weight:900;flex:0 0 auto}
.ccv2-contact-copy{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.ccv2-contact-copy strong{font-size:14px}.ccv2-contact-copy small{font-size:10px;opacity:.72;margin-top:3px}
.ccv2-contact-badge{margin-left:auto;min-width:24px;height:24px;padding:0 7px;border-radius:999px;display:grid;place-items:center;background:var(--ccv2-alert);color:#fff;font-size:12px;font-weight:900}
.ccv2-contact-badge[hidden]{display:none!important}
.ccv2-nav-section{display:flex!important;flex-direction:column!important;gap:3px!important;padding:0!important}
.ccv2-nav-section-title{padding:11px 10px 5px!important;font-size:10px!important;font-weight:900!important;letter-spacing:.12em!important;color:rgba(255,255,255,.55)!important}
.ccv2-nav-link,.ccv2-nav .nav-button{
  width:100%!important;min-height:42px!important;display:flex!important;align-items:center!important;gap:9px!important;
  padding:8px 10px!important;border:0!important;border-radius:10px!important;text-decoration:none!important;
  background:transparent!important;color:rgba(255,255,255,.88)!important;font:inherit!important;font-size:13px!important;
  font-weight:750!important;text-align:left!important;cursor:pointer!important
}
.ccv2-nav-link:hover,.ccv2-nav .nav-button:hover{background:rgba(255,255,255,.08)!important;color:#fff!important}
.ccv2-nav-link.is-active,.ccv2-nav .nav-button.active{background:rgba(255,255,255,.14)!important;color:#fff!important}
.ccv2-nav-icon{width:28px!important;height:28px!important;min-width:28px!important;display:grid!important;place-items:center!important;border-radius:8px!important;background:rgba(255,255,255,.08)!important;font-size:10px!important;font-weight:900!important}
.ccv2-nav-label{min-width:0;flex:1}.ccv2-nav-link small{font-size:9px;opacity:.62}
.ccv2-advanced{margin-top:2px;border-top:1px solid rgba(255,255,255,.08);padding-top:3px!important}
.ccv2-header-contact{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:8px 11px;border-radius:999px;text-decoration:none;border:1px solid var(--ccv2-border);background:#fff;color:var(--ccv2-green-dark);font-size:12px;font-weight:900;white-space:nowrap}
.ccv2-header-contact:hover{background:var(--ccv2-green-soft)}
.ccv2-header-contact b{min-width:22px;height:22px;padding:0 6px;border-radius:999px;display:grid;place-items:center;background:var(--ccv2-alert);color:#fff;font-size:11px}
.ccv2-header-contact b[hidden]{display:none!important}
.ccv2-header-contact.has-unread{border-color:#f0b3b3;background:var(--ccv2-alert-soft);color:#962323}
.ccv2-header-contact-floating{position:fixed;right:16px;top:16px;z-index:9997;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.ccv2-fallback-menu{position:fixed;left:16px;top:16px;z-index:9997;display:flex;align-items:center;gap:7px;min-height:42px;padding:7px 12px;border:0;border-radius:12px;background:var(--ccv2-green);color:#fff;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.15);cursor:pointer}
.ccv2-fallback-menu span{width:28px;height:28px;border-radius:8px;background:#fff;color:var(--ccv2-green);display:grid;place-items:center}
.ccv2-drawer{position:fixed;inset:0;z-index:10020;background:rgba(4,25,20,.44);opacity:0;pointer-events:none;transition:opacity .18s ease}
.ccv2-drawer.is-open{opacity:1;pointer-events:auto}.ccv2-drawer-panel{width:min(320px,88vw);height:100%;overflow:auto;padding:16px;background:var(--ccv2-green-dark);color:#fff;transform:translateX(-102%);transition:transform .18s ease}
.ccv2-drawer.is-open .ccv2-drawer-panel{transform:translateX(0)}
.ccv2-drawer-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 16px}
.ccv2-drawer-head button{width:40px;height:40px;border:0;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;font-size:24px;cursor:pointer}
@media(max-width:760px){
  .ccv2-header-contact span{display:none}.ccv2-header-contact{padding:7px 9px;min-width:40px;justify-content:center}
  .ccv2-header-contact:not(.has-unread)::before{content:"話";font-weight:900}
  .ccv2-header-contact-floating{right:10px;top:10px}.ccv2-fallback-menu{left:10px;top:10px}
}

EOF_CSS

          cat > CONTROL_CENTER_UI_V2_PHASE1.txt <<'EOF_NOTE'
DPRO CONTROL CENTER UI V2 / PHASE 1 R1
DATE: 2026-09-21

Scope:
- 共通ナビゲーションの第1段階
- 顧客対応を最優先固定入口へ
- PCヘッダーに顧客対応ショートカット
- CONTROL CENTER画面でサーバー未読状態を表示
- 既存index SPAの主要ボタンを再利用
- sidebarが無い特殊画面は安全なdrawer入口
- DPRO CONTACT PWA本体は変更しない
- DB/RPC/Workerは変更しない

Protected:
contact-v1.html
contact-v1.webmanifest
contact-v1-sw.js
contact-v1.js
contact-v1-notification-r1.js

Next:
実機QA後、cross-device read syncを別工程で実装する。

EOF_NOTE

      - name: Enable shared shell from config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("config.js")
          s = p.read_text(encoding="utf-8")
          needle = '\n\n(() => {\n  "use strict";'
          if needle not in s:
              raise SystemExit("CONFIG_INSERT_POINT_NOT_FOUND")
          if "DPRO_CC_SHELL_V2_ACTIVE" in s:
              raise SystemExit("UI_V2_SHELL_ALREADY_PRESENT")

          loader = '''
          // DPRO CONTROL CENTER UI V2 / PHASE 1
          // Navigation + contact priority only. DPRO CONTACT PWA does not load config.js.
          window.DPRO_CC_SHELL_V2_ACTIVE = true;
          (() => {
            const cssHref = "./cc-shell-v2.css?v=DPRO-CC-UI-V2-PHASE1-R1-20260921";
            if (!document.querySelector('link[data-dpro-cc-shell-v2="true"]')) {
              const link = document.createElement("link");

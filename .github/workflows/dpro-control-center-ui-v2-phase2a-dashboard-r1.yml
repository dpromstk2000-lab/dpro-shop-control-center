name: DPRO Control Center UI V2 Phase 2A Dashboard R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-control-center-ui-v2-phase2a-dashboard-r1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard current UI V2
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f cc-shell-v2.css
          test -f config.js
          grep -F 'DPRO-CC-UI-V2-PHASE1C-R1-20260921' config.js
          grep -F '<section id="view-dashboard" class="view active-view">' index.html

      - name: Rebuild dashboard as action-first home
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/old-dashboard.html
          printf '%s' '' | base64 -d > /tmp/new-dashboard.html
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = Path("/tmp/old-dashboard.html").read_text(encoding="utf-8")
          new = Path("/tmp/new-dashboard.html").read_text(encoding="utf-8")
          if old not in s:
              raise SystemExit("DASHBOARD_BASELINE_NOT_FOUND")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Add dashboard V2 styling
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d >> cc-shell-v2.css

      - name: Bump dashboard cache key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("config.js")
          s = p.read_text(encoding="utf-8")
          old = "./cc-shell-v2.css?v=DPRO-CC-UI-V2-PHASE1C-R1-20260921"
          new = "./cc-shell-v2.css?v=DPRO-CC-UI-V2-PHASE2A-R1-20260921"
          if old not in s:
              raise SystemExit("CSS_CACHE_BASELINE_NOT_FOUND")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check config.js
          grep -F '今日のDPRO SHOP' index.html
          grep -F 'ccv2-home-actions' index.html
          grep -F '今日やること' index.html
          grep -F '<details class="ccv2-overview-details">' index.html
          grep -F 'PHASE 2A / action-first dashboard' cc-shell-v2.css
          grep -F 'DPRO-CC-UI-V2-PHASE2A-R1-20260921' config.js
          test "$(grep -o 'id="metricGrid"' index.html | wc -l)" -eq 1
          test "$(grep -o 'id="dashboardTasks"' index.html | wc -l)" -eq 1
          test "$(grep -o 'id="dashboardClients"' index.html | wc -l)" -eq 1
          if git diff --name-only | grep -E '^contact-v1(\.|-)|^dpro-contact-' >/dev/null; then
            echo "Protected DPRO CONTACT file changed."
            exit 1
          fi

      - name: Remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/dpro-control-center-ui-v2-phase2a-dashboard-r1.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add action-first Control Center dashboard"
          git push

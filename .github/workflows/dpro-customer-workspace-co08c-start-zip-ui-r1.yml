name: DPRO Customer Workspace CO08C Start ZIP UI R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-customer-workspace-co08c-start-zip-ui-r1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD^)"
          test "$BASE" = "744073b97217d535b7c7e595b75694b6ba87cc06"
          grep -F 'DPRO-CUSTOMER-WORKSPACE-CO07B-DRY-RUN-UI-R1-20260921' customer-workspace.js
          ! grep -F 'data-start-zip=' customer-workspace.js

      - name: Apply CO08C
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/co08c_patch.py
          python /tmp/co08c_patch.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check customer-workspace.js
          grep -F 'DPRO-CUSTOMER-WORKSPACE-CO08C-START-ZIP-UI-R1-20260922' customer-workspace.js
          grep -F 'dpro-customer-start-package' customer-workspace.js
          grep -F 'data-start-zip=' customer-workspace.js
          grep -F '① ChatGPT START ZIP' customer-workspace.js
          grep -F '② Customer Workspaceを開始' customer-workspace.js
          grep -F 'DPRO_PRODUCT_RELEASE_MASTER_V1.2' customer-workspace.js
          grep -F 'cc_contract_items' customer-workspace.js
          grep -F 'cc_service_catalog' customer-workspace.js
          grep -F '.customer-start-flow' customer-workspace.css
          grep -F 'CO08C-START-ZIP-UI-R1-20260922' customer-workspace.html
          grep -F 'CO-08' customer-workspace.html

          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(printf 'customer-workspace.css\ncustomer-workspace.html\ncustomer-workspace.js')"
          test "$CHANGED" = "$EXPECTED"

          if git diff --name-only | grep -E '^contact-v1|^product-release-package|\.sql$|^worker|^contact-onboarding|^center9-maintenance' >/dev/null; then
            echo "Protected area changed."
            git diff --name-only
            exit 1
          fi

      - name: Remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/dpro-customer-workspace-co08c-start-zip-ui-r1.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add ChatGPT customer START ZIP flow CO-08C"
          git push

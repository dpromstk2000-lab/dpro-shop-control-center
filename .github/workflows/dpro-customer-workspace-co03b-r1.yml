name: DPRO Customer Workspace CO03B Setup Wizard R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-customer-workspace-co03b-r1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD^)"
          test "$BASE" = "8ba9f8db33ddcbe0cfd5c6d633f7d4c493ba7df4"
          grep -F 'DPRO-CUSTOMER-WORKSPACE-CO02-R1-20260921' customer-workspace.js
          grep -F 'customer-workspace.css?v=DPRO-CUSTOMER-WORKSPACE-CO02-R1-20260921' customer-workspace.html
          grep -F 'customer-workspace.js?v=DPRO-CUSTOMER-WORKSPACE-CO02-R1-20260921' customer-workspace.html
          ! grep -F 'id="setupWizardBlock"' customer-workspace.html

      - name: Apply CO03B setup wizard
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/co03b_patch.py
          python /tmp/co03b_patch.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check customer-workspace.js
          grep -F 'DPRO-CUSTOMER-WORKSPACE-CO03B-SETUP-WIZARD-R1-20260921' customer-workspace.js
          grep -F 'cc_customer_onboarding_name_plan' customer-workspace.js
          grep -F 'cc_customer_onboarding_save_setup' customer-workspace.js
          grep -F 'id="setupWizardBlock"' customer-workspace.html
          grep -F 'Owner → SYSTEM → Supabase → GitHub → Cloudflare' customer-workspace.html
          grep -F 'service_role / API key等のsecretは管理センターへ保存しません' customer-workspace.html
          grep -F '.setup-wizard-block' customer-workspace.css
          grep -F 'CO03B-SETUP-WIZARD-R1-20260921' customer-workspace.html

          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(printf 'customer-workspace.css\ncustomer-workspace.html\ncustomer-workspace.js')"
          test "$CHANGED" = "$EXPECTED"

          if git diff --name-only | grep -E '^contact-v1|^product-release-package|\.sql$|^worker|^contact-onboarding' >/dev/null; then
            echo "Protected area changed."
            git diff --name-only
            exit 1
          fi

      - name: Remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/dpro-customer-workspace-co03b-r1.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add contract-to-production setup wizard CO-03B"
          git push

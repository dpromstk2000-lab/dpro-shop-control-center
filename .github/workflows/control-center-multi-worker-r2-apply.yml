name: CONTROL CENTER Multi-Worker R2 Apply

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write Multi-Worker R2 addon
        shell: python
        env:
          CCMW_R2_B64: ""
        run: |
          import os, base64
          from pathlib import Path
          Path("control-center-multi-worker-r2.js").write_bytes(base64.b64decode(os.environ["CCMW_R2_B64"]))

      - name: Activate R2 from config.js
        shell: python
        env:
          CCMW_LOADER_B64: ""
        run: |
          import os, base64
          from pathlib import Path
          path = Path("config.js")
          text = path.read_text()
          marker = "CONTROL CENTER MULTI-WORKER R2 / activated 2026-10-04"
          if marker not in text:
              loader = base64.b64decode(os.environ["CCMW_LOADER_B64"]).decode()
              path.write_text(text.rstrip() + loader + "\n")

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check control-center-multi-worker-r2.js
          node --check config.js
          grep -q "CONTROL CENTER MULTI-WORKER R2 / activated 2026-10-04" config.js
          grep -q "data-cc-multi-worker-r2" config.js

      - name: Commit generated CONTROL CENTER changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.js control-center-multi-worker-r2.js
          git commit -m "Complete CONTROL CENTER Multi-Worker R2"
          git push

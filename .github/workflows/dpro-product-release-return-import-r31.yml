name: DPRO Product Release Return Import R3.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-product-release-return-import-r31.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard current baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD^)"
          test "$BASE" = "47b22f99a72b5fef71c019e76536c75dccb52ba2"
          grep -F 'DPRO-PRODUCT-RELEASE-CC-R3-HISTORY-GUARD-20260921' product-release-package.js
          grep -F 'async function onReleaseReturn(event)' product-release-package.js
          grep -F 'history_preservation_required' product-release-package.js
          grep -F 'product-release-package.js?v=PRODUCT-RELEASE-CC-R3-HISTORY-GUARD-20260921' product-release-package.html

      - name: Apply RETURN evidence merge
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/return_import_r31.py
          python /tmp/return_import_r31.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check product-release-package.js
          grep -F 'DPRO-PRODUCT-RELEASE-CC-R3.1-RETURN-EVIDENCE-MERGE-20260921' product-release-package.js
          grep -F 'SHA256SUMS.txt' product-release-package.js
          grep -F 'DEPLOY_ATTESTATION.json' product-release-package.js
          grep -F 'PUBLIC_SURFACE_MATRIX.json' product-release-package.js
          grep -F 'HUMAN_ACCEPTANCE.json' product-release-package.js
          grep -F 'OPEN_DEFECT_REGISTER.json' product-release-package.js
          grep -F 'payload.public_urls.official=' product-release-package.js
          grep -F 'return_zip_integrity' product-release-package.js
          grep -F 'PRODUCT-RELEASE-CC-R3.1-RETURN-EVIDENCE-MERGE-20260921' product-release-package.html

          CHANGED="$(git diff --name-only | grep -v '^.github/workflows/dpro-product-release-return-import-r31.yml$' || true)"
          test "$CHANGED" = "$(printf 'product-release-package.html\nproduct-release-package.js')"

      - name: Remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/dpro-product-release-return-import-r31.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Product Release RETURN ZIP import"
          git push

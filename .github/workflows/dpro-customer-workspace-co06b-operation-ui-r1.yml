name: DPRO Customer Workspace CO06B Operation UI R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-customer-workspace-co06b-operation-ui-r1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD^)"
          test "$BASE" = "4f265324694c436db6f2dd5456a4c2f729825494"
          grep -F 'DPRO-CUSTOMER-WORKSPACE-CO05B-GO-LIVE-GATE-UI-R1-20260921' customer-workspace.js
          grep -F 'id="goLiveGateBlock"' customer-workspace.html
          ! grep -F 'id="operationBlock"' customer-workspace.html

      - name: Apply CO06B
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/co06b_patch.py
          python /tmp/co06b_patch.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check customer-workspace.js
          grep -F 'DPRO-CUSTOMER-WORKSPACE-CO06B-OPERATION-UI-R1-20260921' customer-workspace.js
          grep -F 'cc_customer_onboarding_operation_state' customer-workspace.js
          grep -F 'cc_customer_onboarding_complete_maintenance' customer-workspace.js
          grep -F 'id="operationBlock"' customer-workspace.html
          grep -F '導入後の保守・運用' customer-workspace.html
          grep -F 'id="maintenanceForm"' customer-workspace.html
          grep -F 'CENTER-9を正本' customer-workspace.html
          grep -F '.operation-block' customer-workspace.css
          grep -F 'CO06B-OPERATION-UI-R1-20260921' customer-workspace.html
          grep -F 'CO-06' customer-workspace.html

          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(printf 'customer-workspace.css\ncustomer-workspace.html\ncustomer-workspace.js')"
          test "$CHANGED" = "$EXPECTED"

          if git diff --name-only | grep -E '^contact-v1|^product-release-package|\.sql$|^worker|^contact-onboarding|^center9-maintenance' >/dev/null; then
            echo "Protected area changed."
            git diff --name-only
            exit 1
          fi

      - name: Remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/dpro-customer-workspace-co06b-operation-ui-r1.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Connect CENTER-9 operation management to Customer Workspace CO-06B"
          git push

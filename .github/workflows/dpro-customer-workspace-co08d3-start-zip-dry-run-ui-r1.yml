name: DPRO Customer Workspace CO08D3 Start ZIP Dry Run UI R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-customer-workspace-co08d3-start-zip-dry-run-ui-r1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD^)"
          test "$BASE" = "734e474836ac5a942eb823812abd39388b059b5e"
          grep -F 'DPRO-CUSTOMER-WORKSPACE-CO08C-START-ZIP-UI-R1-20260922' customer-workspace.js
          ! grep -F 'id="downloadDryRunReadyZipButton"' customer-workspace.html

      - name: Apply CO08D3
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/co08d3_patch.py
          python /tmp/co08d3_patch.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check customer-workspace.js
          grep -F 'DPRO-CUSTOMER-WORKSPACE-CO08D3-START-ZIP-DRY-RUN-UI-R1-20260922' customer-workspace.js
          grep -F 'id="downloadDryRunReadyZipButton"' customer-workspace.html
          grep -F 'id="downloadDryRunBrushupZipButton"' customer-workspace.html
          grep -F 'START ZIP SAFE DRY RUN' customer-workspace.html
          grep -F 'dry_run:true' customer-workspace.js
          grep -F 'BRUSHUP_REQUIRED' customer-workspace.js
          grep -F 'READY_FOR_ONBOARDING' customer-workspace.js
          grep -F 'X-DPRO-Dry-Run' customer-workspace.js
          grep -F '.dryrun-zip-test' customer-workspace.css
          grep -F 'CO08D3-START-ZIP-DRY-RUN-UI-R1-20260922' customer-workspace.html
          grep -F 'CO-08D' customer-workspace.html

          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(printf 'customer-workspace.css\ncustomer-workspace.html\ncustomer-workspace.js')"
          test "$CHANGED" = "$EXPECTED"

          if git diff --name-only | grep -E '^contact-v1|^product-release-package|\.sql$|^worker|^contact-onboarding|^center9-maintenance' >/dev/null; then
            echo "Protected area changed."
            git diff --name-only
            exit 1
          fi

      - name: Remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/dpro-customer-workspace-co08d3-start-zip-dry-run-ui-r1.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add safe START ZIP dry run UI CO-08D3"
          git push
